# nginx/nginx.conf

# Usuario y procesos de trabajo
user  nginx;
worker_processes  auto;

# Configuración de logs de errores
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Número máximo de conexiones simultáneas por worker
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato del log de acceso (útil para depurar tráfico)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ----------------------------------------------------------------------
    # 1. DEFINICIÓN DE UPSTREAMS (Grupos de Servidores)
    # ----------------------------------------------------------------------
    # Estos nombres deben coincidir con los "services" en tu docker-compose.yml
    
    # Frontend Next.js (Puerto 3001)
    # Ejecutándose en el host local
    upstream frontend_upstream {
        server host.docker.internal:3001; 
    }

    # API Backend NoSQL - MongoDB (Puerto 3000)
    # Ejecutándose en el host local
    upstream api_mongo_upstream {
        server host.docker.internal:3000; 
    }

    # API Backend SQL - MySQL (Puerto 3002)
    # Ejecutándose en el host local
    upstream api_mysql_upstream {
        server host.docker.internal:3002; 
    }

    # ----------------------------------------------------------------------
    # 2. SERVIDOR PRINCIPAL (Puerto 80)
    # ----------------------------------------------------------------------
    server {
        listen 80;
        server_name localhost; 

        # Permitir subidas de archivos grandes (opcional, ej: imágenes)
        client_max_body_size 10M;

        # --- A. ENRUTAMIENTO FRONTEND ---
        # URL PÚBLICA: http://localhost/
        location / {
            # Redirige todo el tráfico raíz al Frontend corriendo en host local puerto 3001
            proxy_pass http://frontend_upstream; 

            # Cabeceras necesarias para WebSockets (Next.js HMR) y pasar la IP real
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host localhost:3001;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # --- B. ENRUTAMIENTO API NOSQL (MONGO) ---
        # URL PÚBLICA: http://localhost/api/
        # Proxy directo al backend local en puerto 3000
        location /api/ {
            # Redirige al Backend NoSQL corriendo en host local puerto 3000
            proxy_pass http://api_mongo_upstream/; 
            
            proxy_set_header Host localhost:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # --- C. ENRUTAMIENTO API SQL (MYSQL) ---
        # URL PÚBLICA: http://localhost/api-sql/
        # Ruta para el backend de MySQL
        location /api-sql/ {
            # Redirige al Backend SQL corriendo en host local puerto 3002
            proxy_pass http://api_mysql_upstream/; 

            proxy_set_header Host localhost:3002;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Páginas de error personalizadas (opcional)
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}