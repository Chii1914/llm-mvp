services:
  # --- 1. Servicio de MongoDB ---
  mongo:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017" # Puerto por defecto de MongoDB
    environment:
      # Credenciales de root para administración inicial (ajusta si es necesario)
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db # <--- Persistencia: Mapea el directorio de datos al volumen
    restart: always
    networks:
      - local_testing

  # --- 2. Servicio de MySQL ---
  mysql:
    image: mysql:8.0 # Versión recomendada
    container_name: mysql_db
    ports:
      - "3306:3306" # Puerto por defecto de MySQL
    environment:
      # Configuración inicial de la base de datos
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: tienda_demo # Base de datos para tu aplicación
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_HOST: '%'
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql # <--- Persistencia: Mapea el directorio de datos al volumen
    restart: always
    networks:
      - local_testing

  # --- 3. Servicio Nginx (Reverse Proxy) ---
  nginx:
    image: nginx:stable-alpine
    container_name: nginx_proxy
    ports:
      # Nginx escuchará en el puerto 80 del host
      - "80:80"
    volumes:
      # Mapea tu archivo de configuración local a Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    networks:
      - local_testing
    extra_hosts:
      # Permite que Nginx acceda a servicios en el host (macOS/Linux)
      - "host.docker.internal:host-gateway"

# --- Definición de Volúmenes para Persistencia ---
volumes:
  mongodb_data:
  mysql_data:

# --- Definición de Red para Servicios Locales ---
networks:
  local_testing:
    driver: bridge